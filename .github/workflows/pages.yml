name: Build Mosen Tools Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public site.b64 site.tar.xz
          mkdir -p public
          cat \
            site_parts/part00.txt \
            site_parts/part01.txt \
            site_parts/part02.txt \
            site_parts/part03.txt \
            site_parts/part04.txt \
            site_parts/part05.txt \
            site_parts/part06.txt \
            site_parts/part07.txt \
            site_parts/part08.txt \
            site_parts/part09.txt \
            site_parts/part10.txt \
            site_parts/part11.txt \
            site_parts/part12.txt \
            site_parts/part13.txt \
            site_parts/tail00.txt \
            site_parts/tail01.txt \
            site_parts/tail02.txt \
            site_parts/tail03.txt \
            site_parts/tail04.txt \
            site_parts/tail05.txt \
            site_parts/tail06.txt \
            site_parts/tail07.txt \
            site_parts/tail08.txt \
            site_parts/tail09.txt \
            site_parts/tail10.txt > site.b64
          base64 --decode site.b64 > site.tar.xz
          xz -t site.tar.xz
          tar -xJf site.tar.xz -C public

          test -f public/index.html
          test -f 'public/DOCX文件编辑器.html'
          test -f 'public/邮件编辑器.html'
          test -f 'public/Tether冻结报告.html'
          test -f 'public/Tether冻结报告-德国.html'
          test -f 'public/Tether冻结资金保留.html'
          test -f 'public/Tether冻结资金保留-德国.html'
          test -f 'public/网站风险查询.html'
          test -f 'public/网站风险查询-德国.html'
          test -f 'public/资金路径调查.html'
          test -f 'public/资金路径调查-德国.html'
          test -f 'public/资金路径调查律师报告.html'
          test -f 'public/资金路径调查律师报告-德国.html'
          test -f 'public/资金路径调查助理报告.html'
          test -f 'public/资金路径调查助理报告-德国.html'
          test -f 'public/Tether.png'
          test -f 'public/图标.png'

          cp docx-template-loader.js public/docx-template-loader.js
          cp shared-order.js public/shared-order.js
          cp access-gate.js public/access-gate.js
          cp access-config.json public/access-config.json
          python3 - <<'PY'
          from pathlib import Path

          # DOCX editor customizations
          p = Path('public/DOCX文件编辑器.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '.app{min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr)}',
              '.app{min-height:100vh;display:grid;grid-template-columns:390px minmax(0,1fr)}'
          )
          s = s.replace(
              '@media(max-width:1040px){.app{grid-template-columns:250px minmax(0,1fr)}',
              '@media(max-width:1040px){.app{grid-template-columns:320px minmax(0,1fr)}'
          )
          s = s.replace(
              '.template-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
              '.template-name{font-size:13px;font-weight:650;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45;overflow-wrap:anywhere}'
          )
          for v in range(1, 20):
              for name in ('docx-template-loader.js', 'shared-order.js'):
                  old = f'<script src="./{name}?v={v}"></script>'
                  s = s.replace(old + '\n', '').replace(old, '')
          s = s.replace(
              '</body>',
              '<script src="./docx-template-loader.js?v=4"></script>\n'
              '<script src="./shared-order.js?v=3"></script>\n'
              '</body>'
          )
          p.write_text(s, encoding='utf-8')

          # Tool center global-order + password-gate support
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          for v in range(1, 20):
              for name in ('shared-order.js', 'access-gate.js'):
                  old = f'<script src="./{name}?v={v}"></script>'
                  s = s.replace(old + '\n', '').replace(old, '')
          s = s.replace(
              '拖拽后的顺序只有在点击保存后才会被记住。',
              '拖拽后点击保存，会把当前顺序保存为所有人使用的全局顺序。'
          )
          s = s.replace(
              '排序保存在当前浏览器的本地存储中。请将本文件与所有 HTML 工具及图片资源放在同一目录中使用。',
              '固定链接会自动读取全局排序。只有拥有仓库写入授权的管理员才能修改全局顺序。'
          )
          s = s.replace('</head>', '<script src="./access-gate.js?v=1"></script>\n</head>')
          s = s.replace('</body>', '<script src="./shared-order.js?v=3"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

          cp -a public/. .

      - name: Build DOCX template index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p templates
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('templates')
          items = []
          for p in sorted(root.glob('*.docx'), key=lambda x: x.name):
              data = p.read_bytes()
              items.append({
                  'name': p.name,
                  'path': p.as_posix(),
                  'region': 'de' if '德国' in p.name else 'us',
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (root / 'index.json').write_text(
              json.dumps({'templates': items}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f'Indexed {len(items)} DOCX templates.')
          PY

      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.html' '*.png' '*.js' access-config.json templates/index.json .nojekyll
          if git diff --cached --quiet; then
            echo 'Site files and template index are already up to date.'
            exit 0
          fi
          git commit -m 'Publish Mosen tools site and template index'
          git push
