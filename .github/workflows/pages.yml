name: Build Mosen Tools Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public site.b64 site.tar.xz
          mkdir -p public
          cat \
            site_parts/part00.txt \
            site_parts/part01.txt \
            site_parts/part02.txt \
            site_parts/part03.txt \
            site_parts/part04.txt \
            site_parts/part05.txt \
            site_parts/part06.txt \
            site_parts/part07.txt \
            site_parts/part08.txt \
            site_parts/part09.txt \
            site_parts/part10.txt \
            site_parts/part11.txt \
            site_parts/part12.txt \
            site_parts/part13.txt \
            site_parts/tail00.txt \
            site_parts/tail01.txt \
            site_parts/tail02.txt \
            site_parts/tail03.txt \
            site_parts/tail04.txt \
            site_parts/tail05.txt \
            site_parts/tail06.txt \
            site_parts/tail07.txt \
            site_parts/tail08.txt \
            site_parts/tail09.txt \
            site_parts/tail10.txt > site.b64
          base64 --decode site.b64 > site.tar.xz
          xz -t site.tar.xz
          tar -xJf site.tar.xz -C public

          test -f public/index.html
          test -f 'public/DOCX文件编辑器.html'
          test -f 'public/邮件编辑器.html'
          test -f 'public/Tether冻结报告.html'
          test -f 'public/Tether冻结报告-德国.html'
          test -f 'public/Tether冻结资金保留.html'
          test -f 'public/Tether冻结资金保留-德国.html'
          test -f 'public/网站风险查询.html'
          test -f 'public/网站风险查询-德国.html'
          test -f 'public/资金路径调查.html'
          test -f 'public/资金路径调查-德国.html'
          test -f 'public/资金路径调查律师报告.html'
          test -f 'public/资金路径调查律师报告-德国.html'
          test -f 'public/资金路径调查助理报告.html'
          test -f 'public/资金路径调查助理报告-德国.html'
          test -f 'public/Tether.png'
          test -f 'public/图标.png'

          cp docx-template-loader.js public/docx-template-loader.js
          cp shared-order.js public/shared-order.js
          cp dynamic-tools.js public/dynamic-tools.js
          cp access-config-fresh.js public/access-config-fresh.js
          cp access-gate.js public/access-gate.js
          cp access-config.json public/access-config.json
          python3 - <<'PY'
          from pathlib import Path

          # DOCX editor customizations
          p = Path('public/DOCX文件编辑器.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '.app{min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr)}',
              '.app{min-height:100vh;display:grid;grid-template-columns:390px minmax(0,1fr)}'
          )
          s = s.replace(
              '@media(max-width:1040px){.app{grid-template-columns:250px minmax(0,1fr)}',
              '@media(max-width:1040px){.app{grid-template-columns:320px minmax(0,1fr)}'
          )
          s = s.replace(
              '.template-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
              '.template-name{font-size:13px;font-weight:650;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45;overflow-wrap:anywhere}'
          )
          for v in range(1, 30):
              for name in ('docx-template-loader.js', 'shared-order.js'):
                  old = f'<script src="./{name}?v={v}"></script>'
                  s = s.replace(old + '\n', '').replace(old, '')
          s = s.replace(
              '</body>',
              '<script src="./docx-template-loader.js?v=4"></script>\n'
              '<script src="./shared-order.js?v=3"></script>\n'
              '</body>'
          )
          p.write_text(s, encoding='utf-8')

          # Tool center global-order + password-gate + dynamic HTML tools support
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          for v in range(1, 30):
              for name in ('shared-order.js', 'dynamic-tools.js', 'access-gate.js', 'access-config-fresh.js'):
                  old = f'<script src="./{name}?v={v}"></script>'
                  s = s.replace(old + '\n', '').replace(old, '')
          s = s.replace(
              '拖拽后的顺序只有在点击保存后才会被记住。',
              '可在美国、德国和其它工具之间跨分类拖拽；点击保存后，分类和顺序都会保存为所有人使用的全局结果。'
          )
          s = s.replace(
              '拖拽后点击保存，会把当前顺序保存为所有人使用的全局顺序。',
              '跨分类拖拽后点击保存，会把当前分类和顺序保存为所有人使用的全局结果。'
          )
          s = s.replace(
              '排序保存在当前浏览器的本地存储中。请将本文件与所有 HTML 工具及图片资源放在同一目录中使用。',
              '固定链接会自动读取全局分类和排序。只有拥有仓库写入授权的管理员才能修改。'
          )
          s = s.replace('</head>', '<script src="./access-config-fresh.js?v=1"></script>\n<script src="./access-gate.js?v=2"></script>\n</head>')
          s = s.replace('</body>', '<script src="./dynamic-tools.js?v=1"></script>\n<script src="./shared-order.js?v=3"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

          # DOCX homepage shortcut generation
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import html
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove generated shortcut cards first so this remains idempotent.
          s = re.sub(r'\n\s*<a class="card" draggable="true" data-id="docx-template-[\\s\\S]*?</a>', '', s)

          templates = []
          for f in sorted(Path('templates').glob('*.docx'), key=lambda x: x.name):
              region = 'de' if '德国' in f.name else 'us'
              templates.append((f, region))

          def card(path, region):
              label = '德国' if region == 'de' else '美国'
              title = path.stem
              rel = path.as_posix()
              encoded = quote(rel, safe='')
              return (
                  f'\n      <a class="card" draggable="true" data-id="docx-template-{encoded}" data-name="{html.escape(title, quote=True)} {label} DOCX" href="DOCX文件编辑器.html?template={encoded}" target="_blank" rel="noopener">\n'
                  f'        <div class="card-top"><div class="icon">DX</div><div class="lang">{label}</div></div>\n'
                  f'        <div class="title">{html.escape(title)}</div><div class="desc">DOCX 文件快捷入口，点击后直接进入编辑器并打开该文件。</div><div class="open">直接编辑 →</div><div class="drag-handle">⋮⋮</div>\n'
                  '      </a>'
              )

          def inject(section_key, label, region):
              global s
              items = [card(path, r) for path, r in templates if r == region]
              if not items:
                  return
              start = s.index(f'<section class="section" data-section="{section_key}">')
              end = s.index('</section>', start)
              close = s.rfind('</div>', start, end)
              s = s[:close] + ''.join(items) + '\n    ' + s[close:]
              end = s.index('</section>', start)
              segment = s[start:end]
              count = segment.count('<a class="card"')
              pattern = rf'(<div class="section-head"><h2>{label}</h2><span>)\d+(</span></div>)'
              s = re.sub(pattern, rf'\g<1>{count}\g<2>', s, count=1)

          inject('us', '美国', 'us')
          inject('de', '德国', 'de')
          total = s.count('<a class="card"')
          s = re.sub(r'<div class="count">\d+ 个工具</div>', f'<div class="count">{total} 个工具</div>', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

          # Website risk PDF export repair
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json

          export_block = base64.b64decode('').decode('utf-8')
          targets = (
              ('public/网站风险查询.html', 'PDF export failed. Please try again.'),
              ('public/网站风险查询-德国.html', 'PDF-Export fehlgeschlagen. Bitte versuchen Sie es erneut.'),
          )

          for filename, fail_msg in targets:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if 'async function wcSaveDocxBlobAsPdf' in s:
                  continue
              start = s.rfind('function exportDocxReport(){')
              end_marker = '\n}\n\n</script>'
              end_base = s.find(end_marker, start)
              if start < 0 or end_base < 0:
                  raise RuntimeError(f'Export function not found in {filename}')
              end = end_base + 2
              block = export_block.replace('__FAIL_MSG_JSON__', json.dumps(fail_msg, ensure_ascii=False))
              p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY

          cp -a public/. .

      - name: Build dynamic HTML tool index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re

          root = Path('tools')

          def read_text(path):
              data = path.read_bytes()
              for enc in ('utf-8', 'utf-8-sig', 'gb18030', 'latin-1'):
                  try:
                      return data.decode(enc)
                  except Exception:
                      pass
              return data.decode('utf-8', errors='replace')

          def meta_value(text, name):
              escaped = re.escape(name)
              patterns = [
                  rf'<meta\b[^>]*\bname\s*=\s*["\']{escaped}["\'][^>]*\bcontent\s*=\s*["\']([^"\']*)["\'][^>]*>',
                  rf'<meta\b[^>]*\bcontent\s*=\s*["\']([^"\']*)["\'][^>]*\bname\s*=\s*["\']{escaped}["\'][^>]*>',
              ]
              for pattern in patterns:
                  m = re.search(pattern, text, flags=re.I | re.S)
                  if m:
                      return html.unescape(m.group(1)).strip()
              return ''

          def title_value(text, fallback):
              custom = meta_value(text, 'mosen-title')
              if custom:
                  return custom
              m = re.search(r'<title\b[^>]*>(.*?)</title>', text, flags=re.I | re.S)
              if m:
                  value = re.sub(r'<[^>]+>', '', m.group(1))
                  value = html.unescape(value).strip()
                  if value:
                      return value
              return fallback

          def category_value(text, rel):
              custom = meta_value(text, 'mosen-category').strip().lower()
              if custom in ('de', '德国'):
                  return 'de'
              if custom in ('other', '其它', '其他', '其它工具', '其他工具'):
                  return 'other'
              if custom in ('us', '美国'):
                  return 'us'
              name = rel.as_posix()
              if '德国' in name:
                  return 'de'
              if '其它' in name or '其他' in name:
                  return 'other'
              return 'us'

          items = []
          for p in sorted(root.rglob('*.html'), key=lambda x: x.as_posix().lower()):
              if not p.is_file():
                  continue
              rel = p.relative_to(Path('.'))
              text = read_text(p)
              title = title_value(text, p.stem)
              description = meta_value(text, 'description') or meta_value(text, 'mosen-description') or '自定义 HTML 工具'
              icon = meta_value(text, 'mosen-icon')
              stable_id = 'dynamic-' + hashlib.sha1(rel.as_posix().encode('utf-8')).hexdigest()[:12]
              items.append({
                  'id': stable_id,
                  'name': p.name,
                  'title': title,
                  'description': description,
                  'path': rel.as_posix(),
                  'category': category_value(text, rel),
                  'icon': icon,
              })

          (root / 'index.json').write_text(
              json.dumps({'tools': items}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f'Indexed {len(items)} dynamic HTML tools.')
          PY

      - name: Build DOCX template index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p templates
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('templates')
          items = []
          for p in sorted(root.glob('*.docx'), key=lambda x: x.name):
              data = p.read_bytes()
              items.append({
                  'name': p.name,
                  'path': p.as_posix(),
                  'region': 'de' if '德国' in p.name else 'us',
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (root / 'index.json').write_text(
              json.dumps({'templates': items}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print(f'Indexed {len(items)} DOCX templates.')
          PY

      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.html' '*.png' '*.js' access-config.json tools/index.json templates/index.json .nojekyll
          if git diff --cached --quiet; then
            echo 'Site files and indexes are already up to date.'
            exit 0
          fi
          git commit -m 'Publish Mosen tools site and indexes'
          git push
