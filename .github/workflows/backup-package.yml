name: Build Complete Backup Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create restore guide and GPT prompt
        shell: bash
        run: |
          cat > RESTORE_README.txt <<'EOF'
墨森工具中心完整迁移备份
========================

用途：
当原 GitHub 账号、邮箱或仓库无法使用时，可把本备份包交给新的 GPT，让它在新的 GitHub 仓库中恢复出同样的一套工具中心。

重要说明：
1. 本备份包含当前仓库中的网页、JS、自动部署工作流、模板目录、排序配置及其它资源。
2. 不包含任何 GitHub Personal Access Token、密码或登录凭据。
3. 新仓库部署后，GitHub Pages 地址会变成：
   https://<新用户名>.github.io/<新仓库名>/
4. shared-order.js 目前写有旧仓库 owner/repo：mosen6266-netizen/mosen6266。
   迁移时必须改成新的 GitHub 用户名和新仓库名，否则“全局排序保存”仍会指向旧仓库。
5. global-order.json 保存当前公共排序。迁移时应原样保留。
6. templates/ 中的 DOCX 模板及 templates/index.json 应一并保留。
7. .github/workflows/pages.yml 是自动构建与发布逻辑，必须保留。

推荐恢复流程：
A. 新建一个空 GitHub 仓库，默认分支 main。
B. 把本 ZIP 解压后的所有文件保持原目录结构上传到新仓库根目录。
C. 修改 shared-order.js：
   OWNER = '<新用户名>'
   REPO = '<新仓库名>'
D. 检查 .github/workflows/pages.yml 是否仍然引用正确的文件路径。
E. 在 GitHub 仓库 Settings -> Pages 中启用 GitHub Pages，Source 使用 Deploy from a branch，Branch 选 main / root（或按新的 GPT 检查后的方案设置）。
F. 等待 Actions 和 Pages 部署成功。
G. 打开新 Pages 地址，检查：工具中心、14 个工具、DOCX 模板、国旗、拖拽排序、全局排序、输出文件名选择等功能。
H. 如需从网页保存全局排序，为新仓库重新创建 Fine-grained personal access token，只给该仓库 Contents: Read and write 权限。不要复用或上传旧 token。

EOF

          cat > GPT_RESTORE_PROMPT.txt <<'EOF'
我上传的是“墨森工具中心”的完整 GitHub 备份包。请你直接帮我把它迁移到我当前连接的 GitHub 账号中新建/指定的仓库，并恢复成和备份时功能一致的一套，不要让我手动逐个改文件。

请严格按以下要求执行：

1. 先解压并检查备份包的完整目录结构，不要删除或改写现有 HTML 工具内容，除非迁移所必需。
2. 新仓库默认分支使用 main。
3. 保留并部署：
   - index.html 墨森工具中心
   - 所有 HTML 工具
   - DOCX文件编辑器.html
   - 邮件编辑器.html
   - docx-template-loader.js
   - shared-order.js
   - global-order.json
   - templates/ 目录及其中 DOCX 模板、index.json
   - 图片资源
   - .github/workflows/ 下的自动构建/部署配置
   - site_parts/ 及其它当前构建依赖
4. 自动把 shared-order.js 里的旧仓库信息替换为新仓库：
   OWNER = 当前新 GitHub 用户名
   REPO = 当前新仓库名
   BRANCH = main
   不允许继续指向 mosen6266-netizen/mosen6266。
5. 保留工具中心的三个分类：美国、德国、其它工具。
6. 美国、德国分类标题要显示对应真实国旗；美国/德国工具卡片右上角国家小气泡也要显示对应国旗。
7. 保留工具中心卡片拖拽排序与“保存当前排序”；排序是全局排序，所有人打开固定原链接都看到管理员最后保存的顺序。
8. 保留 DOCX 编辑器：
   - 美国模板 / 德国模板 / 我的模板
   - 文件名含“德国”的内置 DOCX 自动归德国，其余归美国
   - 左侧栏加宽，长文件名完整换行显示
   - 美国、德国标题显示对应国旗
   - 模板可拖拽排序，点“保存当前排序”后保存为全局顺序
   - 手动上传 DOCX 功能继续保留
9. 保留 DOCX 输出文件名选择窗口的美国/德国两个板块，并保留现有 8 个固定输出名称与国旗显示。
10. templates/ 以后仍然是我上传内置 DOCX 模板的唯一固定目录。上传/删除 DOCX 后，自动构建要更新 templates/index.json，不需要手改 HTML。
11. 保留 global-order.json 中当前顺序，除非新仓库结构导致 ID 不匹配；如不匹配，请在不改变视觉顺序的前提下修复。
12. 保留 GitHub Pages 可直接访问：
    - 根地址打开墨森工具中心
    - 每个 HTML 工具都能通过固定 URL 直接打开
13. 检查缓存版本号，确保新部署不会继续读取旧 JS。
14. 完成后请实际检查 GitHub Actions / Pages 是否成功，并给我：
    - 新的墨森工具中心固定链接
    - DOCX 编辑器固定链接
    - templates/ 上传目录链接
    - 新仓库链接
15. 不要把任何 Personal Access Token 写入仓库或网页。需要管理员全局保存排序时，仍然只在浏览器临时输入 fine-grained token；token 仅给新仓库 Contents: Read and write 权限。
16. 如果备份中已有自动部署工作流，优先修复复用，不要重新设计整套架构。
17. 不要只告诉我步骤。你应当直接使用已连接的 GitHub 工具完成仓库创建/上传/修改/部署；只有当连接权限确实缺失时才告诉我缺少哪一步授权。

迁移目标：最终效果必须尽量与备份时一致，我只需要把新固定链接发给别人即可使用。
EOF

      - name: Build complete zip
        shell: bash
        run: |
          mkdir -p /tmp/mosen-backup
          rsync -a --exclude='.git' ./ /tmp/mosen-backup/
          cd /tmp
          zip -qr mosen6266-complete-backup.zip mosen-backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosen6266-complete-backup
          path: /tmp/mosen6266-complete-backup.zip
          if-no-files-found: error
          retention-days: 90
