name: Build Complete Backup Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build UTF-8 backup zip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          out = Path('/tmp/mosen6266-complete-backup.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if '.git' in p.parts or p.is_dir():
                      continue
                  arc = Path('mosen-backup') / p
                  z.write(p, arc.as_posix())
          print(out, out.stat().st_size)
          PY

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosen6266-complete-backup
          path: /tmp/mosen6266-complete-backup.zip
          if-no-files-found: error
          retention-days: 90
