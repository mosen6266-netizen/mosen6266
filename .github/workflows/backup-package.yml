name: Build Complete Backup Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backup zip
        run: |
          mkdir -p /tmp/mosen-backup
          rsync -a --exclude='.git' ./ /tmp/mosen-backup/
          cd /tmp
          zip -qr mosen6266-complete-backup.zip mosen-backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosen6266-complete-backup
          path: /tmp/mosen6266-complete-backup.zip
          if-no-files-found: error
          retention-days: 90
